name: Offline regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # 固定受支持的 Intel 镜像，保留 Python 3.9 与 3.12 的验证矩阵。
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: /bin/bash -n start.sh stop.sh make_dist.sh build_vision_ocr.sh
      - run: python -m unittest discover -p 'test_*.py' -v
      - run: python check_release.py --tracked
      - run: bash make_dist.sh
      - run: bash build_vision_ocr.sh
